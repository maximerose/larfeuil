name: CD / Deploy to o2switch

on:
  workflow_run:
    workflows: ["CI / Quality & Tests"]
    branches: ["main", "master"]
    types: [completed]

jobs:
  deploy:
    name: Déploiement Webhook o2switch
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Déclencher le déploiement
        run: |
          curl -k -f -X POST "https://larfeuil.maximerose.com/api/deploy-webhook/?token=${{ secrets.SECRET_KEY }}"
