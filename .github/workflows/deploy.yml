name: CD / Debug Connection

on:
  workflow_run:
    workflows: ["CI / Quality & Tests"]
    branches: ["main", "master"]
    types: [completed]

jobs:
  debug:
    name: Diagnostic Réseau SSH
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: 1. Inspection des variables
        run: |
          echo "--- Verification des formats ---"
          echo "Host : '[${{ secrets.O2SWITCH_HOST }}]'"
          echo "User : '[${{ secrets.O2SWITCH_USER }}]'"
          echo "Port : '[${{ secrets.O2SWITCH_PORT }}]'"
          echo "Longueur clé SSH : ${#SSH_KEY} caractères"
        env:
          SSH_KEY: ${{ secrets.O2SWITCH_SSH_KEY }}

      - name: 2. Test de résolution DNS et ping TCP (Netcat)
        run: |
          echo "--- Test de port TCP avec netcat ---"
          nc -zv -w 10 ${{ secrets.O2SWITCH_HOST }} ${{ secrets.O2SWITCH_PORT }}
