name: CI / Quality & Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Linting & Unit Tests
    runs-on: ubuntu-latest

    # 1. On déclare les variables d'environnement au niveau global du job
    env:
      DJANGO_SUPERUSER_USERNAME: testadmin
      DJANGO_SUPERUSER_EMAIL: admin@test.local
      DJANGO_SUPERUSER_PASSWORD: TestPassword123!
      DJANGO_LAURIE_USERNAME: testlaurie
      DJANGO_LAURIE_EMAIL: laurie@test.local
      DJANGO_LAURIE_PASSWORD: TestPassword123!
      SECRET_KEY: ci-secret-key-testing

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Configuration de Node.js (pour Tailwind)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Installation des dépendances Node.js
        run: npm ci || npm install

      - name: Installation des dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pre-commit

      # 2. pre-commit va maintenant lancer le linting ET les tests avec les bonnes variables
      - name: Contrôle de qualité global (pre-commit)
        run: pre-commit run --all-files

      - name: Construction des assets CSS (Tailwind)
        run: npm run tailwind:build

      # 3. Plus besoin de l'étape "Exécution des tests unitaires Django" isolée
      # puisqu'ils viennent de tourner dans le pre-commit juste au-dessus.

      - name: Vérification de la configuration Django (Check & Static)
        run: |
          python manage.py check
          python manage.py collectstatic --noinput --ignore input.css
