<div class="space-y-1">
  {% if label %}
    <label for="{{ name }}" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">{{ label }}</label>
  {% endif %}

  <div class="relative">
    <input type="number"
           step="0.01"
           id="{{ name }}"
           name="{{ name }}"
           value="{{ value|stringformat:'.2f'|default:'' }}"
           {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}
           {% if required %}required{% endif %}
           {% if autofocus %}autofocus{% endif %}
           class="input-base px-4 py-2.5 pr-8 font-medium" />
    <span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 font-bold pointer-events-none">€</span>
  </div>

  {% if help_text %}<p class="text-[11px] text-slate-500">{{ help_text }}</p>{% endif %}
</div>
