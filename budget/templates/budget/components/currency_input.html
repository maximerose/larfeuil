<div class="space-y-1">
  {% if label %}
    <label for="{{ name }}" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">{{ label }}</label>
  {% endif %}

  <div class="relative flex items-center">
    <!-- Bouton de bascule +/- pour contourner les restrictions des claviers mobiles -->
    <button type="button"
            tabindex="-1"
            onclick="(function(id){ const el = document.getElementById(id); if(!el) return; el.value = el.value.startsWith('-') ? el.value.slice(1) : ('-' + el.value); })('{{ name }}')"
            class="absolute left-2 z-10 px-2 py-1 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 rounded-lg text-xs font-bold border border-brand-border/60 transition-all select-none cursor-pointer">
      ±
    </button>

    <input type="text"
           inputmode="decimal"
           pattern="^-?\d*[.,]?\d*$"
           id="{{ name }}"
           name="{{ name }}"
           value="{{ value|stringformat:'.2f'|default:'' }}"
           {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}
           {% if required %}required{% endif %}
           {% if autofocus %}autofocus{% endif %}
           class="input-base pl-11 pr-8 py-2.5 font-medium w-full" />

    <span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 font-bold pointer-events-none">€</span>
  </div>

  {% if help_text %}<p class="text-[11px] text-slate-500">{{ help_text }}</p>{% endif %}
</div>
