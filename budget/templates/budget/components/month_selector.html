<!-- Sélecteur de mois : Fixé sous le header, ultra-fin, avec ombre fondue -->
<div class="sticky top-16 z-30 -mx-4 px-4 sm:-mx-6 sm:px-6 lg:-mx-8 lg:px-8 mb-6 bg-brand-dark/80 backdrop-blur-xl border-b border-brand-border/50 shadow-[0_10px_15px_-3px_rgba(0,0,0,0.3)] transition-all">
  <div class="flex items-center w-full py-2">

    <!-- Bouton Calendrier (Archives) -->
    <div class="relative shrink-0 flex items-center justify-center pr-3 border-r border-brand-border/60 mr-2">
      <input type="month"
             id="archive-month-picker"
             class="sr-only"
             onchange="if(this.value) window.location.href='?month=' + this.value"
             value="{{ selected_month|date:'Y-m' }}" />

      <button type="button"
              onclick="const p = document.getElementById('archive-month-picker'); if(p.showPicker){ p.showPicker(); } else { p.click(); }"
              title="Choisir un mois (Archives)"
              class="w-7 h-7 bg-slate-800 text-slate-400 rounded-lg flex items-center justify-center transition-colors hover:text-brand hover:bg-brand/10 cursor-pointer">
        {% include "budget/components/icon.html" with name="calendar" class="w-3.5 h-3.5" %}
      </button>
    </div>

    <!-- Ruban glissant -->
    <div class="flex-1 overflow-hidden relative">
      <div class="absolute left-0 top-0 bottom-0 w-3 bg-linear-to-r from-brand-dark/90 to-transparent pointer-events-none z-10">
      </div>
      <div class="absolute right-0 top-0 bottom-0 w-6 bg-linear-to-l from-brand-dark/90 to-transparent pointer-events-none z-10">
      </div>

      <div class="flex overflow-x-auto gap-2 scrollbar-hide py-1 items-center snap-x"
           id="month-scroll-container">
        {% for m in budget_months_list %}
          <a hx-get="?month={{ m.url_value }}"
             hx-target="body"
             hx-indicator="#page-loader"
             hx-swap="innerHTML show:none settle:100ms"
             hx-push-url="true"
             hx-trigger="click delay:250ms"
             onclick="
               this.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
               document.querySelectorAll('#month-scroll-container a').forEach(el => {
                  el.classList.remove('bg-brand', 'text-brand-dark', 'border-brand', 'shadow-md', 'shadow-brand/20');
                  if(!el.classList.contains('bg-action-info/10')) {
                      el.classList.add('bg-slate-800', 'text-slate-400', 'border-transparent');
                  }
               });
               this.classList.remove('bg-slate-800', 'text-slate-400', 'border-transparent');
               this.classList.add('bg-brand', 'text-brand-dark', 'border-brand', 'shadow-md', 'shadow-brand/20');
             "
             {% if m.is_active %}id="active-month-tab"{% endif %}
             class="snap-center shrink-0 text-[11px] sm:text-xs font-semibold px-3 py-1 sm:px-4 sm:py-1.5 rounded-full border transition-colors cursor-pointer {% if m.is_active %} bg-brand text-brand-dark border-brand shadow-md shadow-brand/20 {% elif m.is_current %} bg-action-info/10 text-action-info border-action-info/30 hover:bg-action-info/20 hover:text-action-info {% else %} bg-slate-800 text-slate-400 border-transparent hover:text-slate-200 hover:border-slate-500 {% endif %}">
            {{ m.label }}
          </a>
        {% endfor %}
      </div>
    </div>
  </div>
</div>

<script>
  function centerActiveMonth() {
    const activeMonth = document.getElementById("active-month-tab");
    if (activeMonth) {
      activeMonth.scrollIntoView({ behavior: "instant", inline: "center", block: "nearest" });
    }
  }
  document.addEventListener("DOMContentLoaded", centerActiveMonth);
  document.body.addEventListener("htmx:afterSettle", function(event) {
    if (event.detail.target.tagName === 'BODY') {
      centerActiveMonth();
    }
  });
</script>
