<div class="space-y-1">
  {% if label %}
    <label for="{{ name }}" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">{{ label }}</label>
  {% endif %}
  <select id="{{ name }}"
          name="{{ name }}"
          {% if required %}required{% endif %}
          data-tomselect="true"
          {% if allow_create %} data-api-create-url="{% url 'api_create_element' %}" data-create-type="{{ create_type }}" {% endif %}
          class="input-base px-3 py-2.5">

    <option value="" {% if required %}disabled{% endif %} {% if not selected %}selected{% endif %}>
      {{ placeholder|default:"Sélectionnez une option..." }}
    </option>

    {% for item in options %}
      {% if item.name %}
        {% if item.id|stringformat:"s" != exclude_value|stringformat:"s" %}
          <option value="{{ item.id }}" {% if item.id|stringformat:"s" == selected|stringformat:"s" %}selected{% endif %}>
            {{ item.name }}
          </option>
        {% endif %}
      {% else %}
        {% if item.0|stringformat:"s" != exclude_value|stringformat:"s" %}
          <option value="{{ item.0 }}" {% if item.0|stringformat:"s" == selected|stringformat:"s" %}selected{% endif %}>
            {{ item.1 }}
          </option>
        {% endif %}
      {% endif %}
    {% endfor %}
  </select>

  {% if help_text %}<p class="text-[11px] text-slate-500">{{ help_text }}</p>{% endif %}
</div>
