{% load budget_tags %}
{% group_categories options as grouped_options %}

<div class="space-y-1">
  {% if label %}
    <label for="{{ name }}"
           class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">{{ label }}</label>
  {% endif %}
  <select id="{{ name }}"
          name="{{ name }}"
          {% if required %}required{% endif %}
          data-tomselect="true"
          {% if allow_create %} data-api-create-url="{% url 'api_create_element' %}" data-create-type="{{ create_type|default:'category' }}" {% endif %}
          class="input-base px-3 py-2.5 text-base sm:text-sm {{ custom_class|default:'' }}">

    <option value="" {% if required %}disabled{% endif %} {% if not selected %}selected{% endif %}>
      {{ placeholder|default:"Sélectionnez une catégorie..." }}
    </option>

    {% for group_name, cats in grouped_options.items %}
      <optgroup label="{{ group_name }}">
        {% for cat in cats %}
          <option value="{{ cat.id }}" {% if cat.id|stringformat:"s" == selected|stringformat:"s" %}selected{% endif %}>
            {{ cat.name }}
          </option>
        {% endfor %}
      </optgroup>
    {% endfor %}
  </select>

  {% if help_text %}<p class="text-[11px] text-slate-500">{{ help_text }}</p>{% endif %}
</div>
