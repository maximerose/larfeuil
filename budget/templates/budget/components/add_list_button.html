<!-- 1. Carte d'ajout classique pleine largeur -->
<button type="button"
        id="add-card-trigger"
        hx-get="{% url url_name %}"
        hx-target="#modal-container"
        class="w-full group bg-transparent border-2 border-dashed border-brand-border hover:border-brand hover:bg-brand/5 p-4 rounded-card transition-all flex flex-col items-center justify-center cursor-pointer {{ custom_class|default:'min-h-25 mt-4' }}">
  <div class="w-10 h-10 bg-slate-800 group-hover:bg-brand text-slate-400 group-hover:text-brand-dark rounded-full flex items-center justify-center transition-colors mb-2 shadow-sm">
    {% include "budget/components/icon.html" with name="plus" class="w-5 h-5" %}
  </div>
  <span class="text-sm font-bold text-slate-400 group-hover:text-brand transition-colors">{{ label }}</span>
</button>

<!-- 2. FAB (Floating Action Button) réduit -->
<button type="button"
        id="mobile-fab"
        hx-get="{% url url_name %}"
        hx-target="#modal-container"
        class="md:hidden fixed bottom-12 right-5 z-40 w-12 h-12 bg-brand text-brand-dark rounded-full shadow-[0_0_15px_rgba(16,185,129,0.4)] flex items-center justify-center hover:scale-105 active:scale-95 transition-all duration-300 transform">
  {% include "budget/components/icon.html" with name="plus" class="w-6 h-6" %}
</button>

<!-- 3. Script d'apparition/disparition -->
<script>
  (function() {
    const triggerCard = document.getElementById('add-card-trigger');
    const fab = document.getElementById('mobile-fab');

    if (triggerCard && fab && !fab.dataset.observed) {
      fab.dataset.observed = "true";
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            fab.classList.add('opacity-0', 'translate-y-20', 'pointer-events-none');
            fab.classList.remove('opacity-100', 'translate-y-0');
          } else {
            fab.classList.remove('opacity-0', 'translate-y-20', 'pointer-events-none');
            fab.classList.add('opacity-100', 'translate-y-0');
          }
        });
      }, { threshold: 0.1 });

      observer.observe(triggerCard);
    }
  })();
</script>
