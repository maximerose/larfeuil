exclude: '^(node_modules/|staticfiles/|.*\.min\.css)'
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
  - id: check-json
    exclude: ^\.devcontainer/
  - id: check-added-large-files
  - id: trailing-whitespace
  - id: end-of-file-fixer

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.3
  hooks:
  - id: ruff
    args: [--fix]
  - id: ruff-format

- repo: https://github.com/djlint/djLint
  rev: v1.47.1
  hooks:
  - id: djlint-django
    args: ["--reformat"]

- repo: local
  hooks:
  - id: django-test
    name: Django Tests
    entry: bash -c 'if [ -f .venv/Scripts/python ]; then .venv/Scripts/python manage.py test --keepdb --parallel; elif [ -f .venv/bin/python ]; then .venv/bin/python manage.py test --keepdb --parallel; else python manage.py test --keepdb --parallel; fi'
    language: system
    types: [python]
    pass_filenames: false
